<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password Reset | GCO</title><link rel="stylesheet" href="css/style.css"></head>
<body class="portal-page"><main class="portal-page-shell"><a class="portal-back" href="portal.html">← BACK TO PORTAL</a>
<section class="portal-auth-card"><p class="section-label">Account recovery</p><h1 class="section-title">Reset <em>Password</em></h1>
<form id="requestForm" class="portal-form"><div class="form-group"><label for="identifier">Email or username</label><input id="identifier" required placeholder="Email or Valentine"></div><button class="btn-primary" type="submit">SEND RESET LINK</button><p class="portal-message" id="requestMessage"></p></form>
<form id="resetForm" class="portal-form" hidden><div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" required></div><button class="btn-primary" type="submit">UPDATE PASSWORD</button><p class="portal-message" id="resetMessage"></p></form></section></main>
<script>
const params=new URLSearchParams(location.search), resetToken=params.get('token'); if(resetToken){requestForm.hidden=true;resetForm.hidden=false;}
requestForm.addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/auth/request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:identifier.value})});const d=await r.json();if(!r.ok)throw Error(d.error);requestMessage.textContent=d.message;}catch(error){requestMessage.textContent=error.message;}});
resetForm.addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){resetMessage.textContent='Passwords do not match.';return;}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resetToken,password:newPassword.value})});const d=await r.json();if(!r.ok)throw Error(d.error);resetMessage.textContent=d.message;resetForm.reset();}catch(error){resetMessage.textContent=error.message;}});
</script>
